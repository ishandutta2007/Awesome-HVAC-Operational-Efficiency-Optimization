<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101E" />
      <stop offset="45%" stop-color="#0E1E38" />
      <stop offset="100%" stop-color="#050C16" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Heating Gradient (Warm Amber / Coral) -->
    <linearGradient id="heatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Cooling Gradient (Cyan / Azure) -->
    <linearGradient id="coolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Efficiency Gradient (Emerald) -->
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseAirflow {
      0% { stroke-dashoffset: 240; opacity: 0.3; }
      50% { opacity: 0.85; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }
    @keyframes heatPulse {
      0% { transform: translateY(0px) scale(1); opacity: 0.2; }
      50% { transform: translateY(-8px) scale(1.08); opacity: 0.45; }
      100% { transform: translateY(0px) scale(1); opacity: 0.2; }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }
    .flow-wave-1 {
      stroke-dasharray: 20, 15;
      animation: pulseAirflow 14s linear infinite;
    }
    .flow-wave-2 {
      stroke-dasharray: 14, 10;
      animation: pulseAirflow 10s linear infinite reverse;
    }
    .ambient-heat {
      animation: heatPulse 6s ease-in-out infinite;
    }
    .pill-card {
      animation: floatPill 5s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #94A3B8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Deep Backdrop -->
  <rect width="1200" height="340" fill="url(#bgGradient)" rx="16" />

  <!-- Technical Grid Background -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="150" y1="0" x2="150" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="450" y1="0" x2="450" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="750" y1="0" x2="750" y2="340" />
    <line x1="900" y1="0" x2="900" y2="340" />
    <line x1="1050" y1="0" x2="1050" y2="340" />
  </g>

  <!-- Animated HVAC Climate Flow Waves in Background -->
  <g fill="none" opacity="0.7">
    <!-- Cool Thermal Supply Loop -->
    <path class="flow-wave-1" stroke="url(#coolGrad)" stroke-width="3" d="M -50 240 Q 200 170, 450 220 T 950 180 T 1250 210" />
    <path class="flow-wave-2" stroke="url(#heatGrad)" stroke-width="2.5" d="M -50 280 Q 250 310, 550 260 T 1000 290 T 1250 250" />
    <path class="flow-wave-1" stroke="url(#ecoGrad)" stroke-width="2" opacity="0.4" d="M -50 140 Q 300 80, 650 130 T 1250 110" />
  </g>

  <!-- Radiant Thermal Glow Orbs in Far Background -->
  <circle class="ambient-heat" cx="1080" cy="80" r="140" fill="#0EA5E9" opacity="0.12" filter="url(#glow)" />
  <circle class="ambient-heat" cx="90" cy="270" r="120" fill="#10B981" opacity="0.1" filter="url(#glow)" />

  <!-- Metric Badges & Live Status Indicators (Right Side) -->
  <g transform="translate(860, 45)" class="pill-card">
    <!-- Card 1: Energy Savings -->
    <rect x="0" y="0" width="290" height="68" rx="12" fill="url(#cardGrad)" stroke="#1E3A8A" stroke-width="1.5" />
    <circle cx="28" cy="34" r="14" fill="#10B981" fill-opacity="0.2" />
    <path d="M 23 34 L 27 38 L 34 29" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="52" y="28" class="tag-text" fill="#10B981">ENERGY OPTIMIZATION</text>
    <text x="52" y="50" font-family="-apple-system, sans-serif" font-weight="700" font-size="18" fill="#F8FAFC">Up to 40% Waste Cut</text>

    <!-- Card 2: AI Control & Setpoints -->
    <rect x="0" y="80" width="290" height="68" rx="12" fill="url(#cardGrad)" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="28" cy="114" r="14" fill="#0284C7" fill-opacity="0.2" />
    <circle cx="28" cy="114" r="5" fill="#38BDF8" />
    <text x="52" y="108" class="tag-text" fill="#38BDF8">MPC &amp; DIGITAL TWINS</text>
    <text x="52" y="130" font-family="-apple-system, sans-serif" font-weight="700" font-size="18" fill="#F8FAFC">Autonomous Dynamic Setpoints</text>

    <!-- Card 3: Occupancy Alignment -->
    <rect x="0" y="160" width="290" height="68" rx="12" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1.5" />
    <circle cx="28" cy="194" r="14" fill="#6366F1" fill-opacity="0.2" />
    <polygon points="28,187 34,198 22,198" fill="#818CF8" />
    <text x="52" y="188" class="tag-text" fill="#A5B4FC">OCCUPANCY TELEMETRY</text>
    <text x="52" y="210" font-family="-apple-system, sans-serif" font-weight="700" font-size="18" fill="#F8FAFC">Real-Time IAQ &amp; Microclimates</text>
  </g>

  <!-- Foreground Title and Core Content (Unobstructed & Clean) -->
  <g transform="translate(60, 60)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#0369A1" fill-opacity="0.35" stroke="#38BDF8" stroke-width="1" />
    <text x="16" y="20" class="tag-text" fill="#38BDF8">⚡ SMART BUILDINGS &amp; CLIMATE TECH</text>

    <!-- Main Headline -->
    <text x="0" y="84" class="title-text" font-size="44">HVAC Operational Efficiency</text>
    <text x="0" y="132" class="title-text" font-size="34" fill="#38BDF8">&amp; Climate Control Optimization</text>

    <!-- Subtitle & Value Proposition -->
    <text x="0" y="174" class="subtitle-text" font-size="16">Curated Ecosystem of Commercial SaaS Platforms &amp; Open-Source Frameworks</text>
    <text x="0" y="200" class="subtitle-text" font-size="14" fill="#64748B">Occupancy-Aware Scheduling • Model Predictive Control • Thermal Storage • BACnet/IoT</text>

    <!-- Feature Quick Pills -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="14" y="17" class="tag-text" fill="#CBD5E1">🏢 Enterprise BMS</text>

      <rect x="142" y="0" width="138" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="156" y="17" class="tag-text" fill="#CBD5E1">🤖 AI Setpoint Tuning</text>

      <rect x="292" y="0" width="130" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="306" y="17" class="tag-text" fill="#CBD5E1">🌿 Decarbonization</text>

      <rect x="434" y="0" width="136" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="448" y="17" class="tag-text" fill="#CBD5E1">💻 Open Source Twins</text>
    </g>
  </g>
</svg>
